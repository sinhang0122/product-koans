<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoAus - 연결 오류</title>
  <style>
    body { margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:-apple-system, 'Apple SD Gothic Neo', sans-serif; background:#fff; }
    .box { text-align:center; padding:24px; }
    .icon { font-size:48px; margin-bottom:12px; }
    h1 { font-size:18px; color:#222; margin:0 0 8px; }
    p { font-size:14px; color:#777; margin:0 0 24px; line-height:1.5; }
    button { background:#1a73e8; color:#fff; border:none; border-radius:8px; padding:12px 32px; font-size:15px; font-weight:600; cursor:pointer; }
    button:active { opacity:.8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>인터넷 연결을 확인해주세요</h1>
    <p>네트워크에 연결한 뒤<br>다시 시도해주세요.</p>
    <button onclick="window.location.href='https://koaus.com.au'">다시 시도</button>
  </div>
</body>
</html>
