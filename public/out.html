<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>원문으로 이동 — KoAus</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .out-wrap{max-width:560px;margin:0 auto;padding:56px 16px;text-align:center}
    .out-title{font-size:20px;font-weight:900;margin:0 0 10px}
    .out-msg{color:var(--text-muted,#666);font-size:14px;line-height:1.6;margin:0 0 18px}
    .out-btn{display:inline-block;padding:10px 18px;border-radius:999px;border:1.5px solid var(--text-primary,#111);background:var(--text-primary,#111);color:var(--bg-base,#fff);font-weight:800;text-decoration:none;margin:4px}
    .out-btn.sec{background:var(--bg-base,#fff);color:var(--text-primary,#111)}
  </style>
</head>
<body>
  <main class="out-wrap">
    <h1 class="out-title" id="outTitle">원문으로 이동합니다…</h1>
    <p class="out-msg" id="outMsg">다른 한인 사이트에 올라온 글입니다. 잠시 뒤 그 사이트로 넘어갑니다. 뒤로가기를 누르면 KoAus 목록으로 돌아옵니다.</p>
    <p id="outBtns"><a class="out-btn sec" id="outBack" href="accom.html">KoAus 목록으로</a></p>
  </main>
  <!--
    11-05: 외부 글 원문 이동 페이지.
    - ext_posts/{id} 를 읽어(visible 만 읽힘) 원문 주소로 location.replace → 이 페이지는 방문 기록에서 빠져 뒤로가기 한 번에 KoAus 목록.
    - 주소의 호스트가 허용 목록(한인 사이트)에 없으면 이동하지 않는다(열린 리다이렉트 방지). 문서는 서버 함수만 쓰지만 한 번 더 막는다.
    - 글이 내려갔거나 없으면 안내 + 목록 링크.
  -->
  <script type="module">
    import './koaus-appcheck-init.js';
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';
    const firebaseConfig = { apiKey: 'AIzaSyCamqnt0bNUD9uz1N5BbCuQjSkWLSpPqlU', authDomain: 'koaus-f564c.firebaseapp.com', projectId: 'koaus-f564c', storageBucket: 'koaus-f564c.firebasestorage.app', messagingSenderId: '663988594088', appId: '1:663988594088:web:ef30c2fd557407b00b299d', measurementId: 'G-DERZ9MTKPL' };
    const ALLOW = ['sunbrisbane.com', 'qvision.com.au', 'hojunara.com', 'hojubada.com', 'melbhanul.com'];
    const BACK = { accom: 'accom.html', rent: 'rent.html', jobs: 'jobs.html' };
    const $ = id => document.getElementById(id);
    const fail = (title, msg) => { $('outTitle').textContent = title; $('outMsg').textContent = msg; };
    (async () => {
      const id = new URLSearchParams(location.search).get('id') || '';
      if (!/^[\w-]{3,120}$/.test(id)) { fail('잘못된 주소입니다', '목록에서 다시 눌러 주십시오.'); return; }
      let d = null;
      try { const db = getFirestore(getApps().length ? getApp() : initializeApp(firebaseConfig)); const s = await getDoc(doc(db, 'ext_posts', id)); d = s.exists() ? s.data() : null; }
      catch (e) { console.warn('[out] 조회 실패', e); }
      if (!d) { fail('이 글은 원문에서 내려갔습니다', '원문 사이트에서 글이 지워졌거나 기간이 지났습니다. KoAus 목록에서 다른 글을 보십시오.'); return; }
      $('outBack').href = BACK[d.board] || 'accom.html';
      let u = null;
      try { u = new URL(String(d.url || '')); } catch (_) {}
      const host = u ? u.hostname.replace(/^www\./, '') : '';
      if (!u || !/^https?:$/.test(u.protocol) || !ALLOW.some(h => host === h || host.endsWith('.' + h))) { fail('이동할 수 없는 주소입니다', '허용되지 않은 사이트 주소라 이동하지 않습니다.'); return; }
      $('outMsg').textContent = (d.sourceName || '원문 사이트') + '로 이동합니다. 뒤로가기를 누르면 KoAus 목록으로 돌아옵니다.';
      $('outBtns').insertAdjacentHTML('afterbegin', `<a class="out-btn" id="outGo" href="${u.toString().replace(/"/g, '&quot;')}" rel="noopener">지금 이동</a> `);
      setTimeout(() => { location.replace(u.toString()); }, 400);
    })();
  </script>
</body>
</html>
